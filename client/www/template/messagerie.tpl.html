<!--La page donnant accès à toutes les conversations de l'utilisateur-->
<h2 class="my-2 ms-3">Conversations</h2>
<div id="noConversationsMessage" style="display: none;">
  <p><div class="m-3">Vous n'avez pas encore de conversations.</div></p>
</div>
<div id="conversationsList">
  {{#users}}
  <div class="card my-2">
    <div class="card-body d-flex align-items-center">
      <div class="user-avatar me-3">
        <img src="{{image}}" alt="Photo de {{first_name}} {{last_name}}" class="rounded-circle"
          style="width: 50px; height: 50px;">
      </div>
      <div>
        <h5 class="card-title mb-1">{{first_name}} {{last_name}}</h5>
        <div data-receiver-id="{{username}}" class="converser btn ajout mt-2">Lui parler</div>
      </div>
    </div>
  </div>
  {{/users}}
</div>
